name: Deploy

on:
  push:
    branches: [main]
    # Every production deploy empties Vercel's ISR cache, so every page is
    # rendered and written again; a change that cannot reach the site does not deploy.
    # Not every Markdown file: data/**/SOURCE.md and LICENSE.md are shipped as attributions.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'apps/web/README.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zytgmnqmrvgspjdokajp

jobs:
  deploy:
    name: Migrate, load search, deploy site
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: STEPBible data (fetched, never committed)
        uses: actions/cache@v4
        with:
          path: |
            data/cache/stepbible
            data/entities/tipnr/TIPNR.txt
          key: stepbible-${{ hashFiles('scripts/fetch-stepbible.mjs') }}
      - run: node scripts/fetch-stepbible.mjs
      - name: Build content from USFM
        run: pnpm content

      # 1. Database first, so the site never runs ahead of the schema.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push

      - name: Load search table
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
          bash scripts/load-search.sh apps/web/static/content "$SUPABASE_DB_URL"

      # 2. Site, built here (Vercel's build image has no Rust) and uploaded prebuilt.
      - name: Deploy to Vercel
        env:
          VERCEL: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: apps/web
        # npx rather than pnpm dlx: pnpm 12 refuses the Vercel CLI's esbuild build script.
        # --archive=tgz: the deployment has ~13,000 files (chapter JSON + prerendered
        # HTML) and Vercel's per-file upload API caps free plans at 5,000.
        run: |
          rm -rf static/content/*/search   # CSVs feed Postgres only, not the site
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"

      # 3. Android app packs (tamilscripture.app design §7.2), after the site so a pack
      #    problem never holds the site back. pack-build compares with the published
      #    catalogue: unchanged packs keep their version and file, so phones only
      #    download what changed. Files first, then the signature and catalogue.
      - name: Build and publish app packs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PACKS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the newer default checksum headers of aws-cli v2.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_PACKS_BUCKET || 'ts-packs' }}
          PACKS_SIGNING_KEY: ${{ secrets.PACKS_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/packs.key"
          printf '%s' "$PACKS_SIGNING_KEY" > "$key"
          curl -sf https://packs.tamilaudiobible.com/packs/catalogue.json -o "$RUNNER_TEMP/previous.json" || true
          # Commentary packs are rebuilt only when a new commentary version is published;
          # otherwise pack-build carries the published ones over.
          commentary=()
          latest=$(curl -sf https://stream.tamilaudiobible.com/commentary/latest.json | jq -r '.version // empty' || true)
          built=$(jq -r '[.packs[]? | select(.type == "commentary") | .build][0] // empty' "$RUNNER_TEMP/previous.json" 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$built" ]; then
            python3 scripts/fetch-commentary.py "$latest" "$RUNNER_TEMP/commentary/$latest"
            commentary=(--commentary "$RUNNER_TEMP/commentary/$latest")
          fi
          cargo run --release -p pack-build -- --content apps/web/static/content --out dist/app \
            --previous "$RUNNER_TEMP/previous.json" --key "$key" "${commentary[@]}"
          rm -f "$key"
          s3() { aws s3 cp --endpoint-url "$R2_ENDPOINT" --only-show-errors "$@"; }
          s3 dist/app/packs "s3://$BUCKET/packs" --recursive --exclude 'catalogue.json*' \
            --cache-control 'public, max-age=31536000, immutable' --content-type application/zstd
          s3 dist/app/packs/catalogue.json.sig "s3://$BUCKET/packs/catalogue.json.sig" --cache-control 'public, max-age=300' --content-type text/plain
          s3 dist/app/packs/catalogue.json "s3://$BUCKET/packs/catalogue.json" --cache-control 'public, max-age=300' --content-type application/json
          s3 dist/app/app/bootstrap.json.sig "s3://$BUCKET/app/bootstrap.json.sig" --cache-control 'public, max-age=300' --content-type text/plain
          s3 dist/app/app/bootstrap.json "s3://$BUCKET/app/bootstrap.json" --cache-control 'public, max-age=300' --content-type application/json
