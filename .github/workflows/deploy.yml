name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zytgmnqmrvgspjdokajp

jobs:
  deploy:
    name: Migrate, load search, deploy site
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build content from USFM
        run: pnpm content

      # 1. Database first, so the site never runs ahead of the schema.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push

      - name: Load search table
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
          bash scripts/load-search.sh apps/web/static/content "$SUPABASE_DB_URL"

      # 2. Site, built here (Vercel's build image has no Rust) and uploaded prebuilt.
      - name: Deploy to Vercel
        env:
          VERCEL: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: apps/web
        # npx rather than pnpm dlx: pnpm 12 refuses the Vercel CLI's esbuild build script.
        # --archive=tgz: the deployment has ~13,000 files (chapter JSON + prerendered
        # HTML) and Vercel's per-file upload API caps free plans at 5,000.
        run: |
          rm -rf static/content/*/search   # CSVs feed Postgres only, not the site
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
