[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/samueldotj/tamilscripture.com"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order: the glossary and journeys are written out in the order their
# TOML lists them, which is the chronological order the atlas reads back.
toml = { version = "0.8", features = ["preserve_order"] }
unicode-normalization = "0.1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
