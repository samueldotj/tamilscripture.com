# Seed list for the theological glossary (docs/feature_dictionary_translation.md §3, G1).
# One line per term: "term | other English forms, comma-separated". The first
# form is the glossary key; the others are how it also appears in the articles.
# Strong's numbers are not listed here: `translate ai-terms` finds them from the
# BSB's own tags for these words, then shows Claude the IRV text of those verses.
# Terms marked `curated` below have no single Bible word (Trinity, sacrament);
# for those Claude proposes the Tamil used in Reformed teaching, for review.
# Terms in capitals (LORD) are matched case-sensitively: the IRV writes the
# LORD (YHWH) as யெகோவா and the Lord as கர்த்தர்.
# Everyday words with many senses (sign, judge, heart) are left out: the check
# would demand one Tamil word wherever they occur.
# Edit freely: add, remove, or move terms; `translate ai-terms` picks up changes.

