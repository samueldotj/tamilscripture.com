[project]
name = "tamilscripture-audio"
version = "0.1.0"
description = "Offline audio Bible tool for tamilscripture.com: ingest, upload, verify (docs/feature_audio_tool.md)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
# `audio align`. Install PyTorch from the CUDA index first (the RTX 5090 needs CUDA 12.8):
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
align = [
    "torch>=2.7",
    "torchaudio>=2.7",
    "uroman>=1.3",
    "numpy",
]

[project.scripts]
audio = "audio_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_tool"]
