[project]
name = "tamilscripture-psalter"
version = "0.1.0"
description = "Psalter tunes for the Psalms explorer: MIDI to MusicXML, then notation, timing and audio (docs/feature_psalms_explorer.md §8)"
requires-python = ">=3.12"
dependencies = [
    "verovio==6.3.0",
    "mido>=1.3",
    "numpy>=1.26",
]

[project.scripts]
psalter = "psalter_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psalter_tool"]
