# Which psalter tunes the Psalms explorer offers for each version of a psalm
# (docs/feature_psalms_explorer.md §9). Keys are the version keys of
# scottish-1650/psalm-NNN.toml: "23", a second version "100-2", a part of Psalm 119
# "119-5". Tune ids are from tunes.toml; the card offers the first, then the others.
# The build rejects a tune whose metre does not fit the version.
#
# Drafted from the "Recommended Tunes" of Pilgrim Covenant Church's "1650 Psalter with
# Notes" (pilgrim-covenant.com), keeping the tunes we have in public-domain MIDI. The
# first choices for 8, 23, 46, 51, 100 and 121 were set by hand before that. Versions
# with no tune here have no recommendation we could use yet.

[psalms]
"1" = ["arlington"]
"2" = ["york"]
"3" = ["belmont"]
"5" = ["grafenberg"]
"8" = ["winchester-old"]
"22" = ["praetorius"]
