# Psalter tunes for the Psalms explorer (docs/feature_psalms_explorer.md §8, §9).
# Each tune is a melody-only MusicXML file in tunes/{id}.musicxml, made by
# `psalter import` from a public-domain MIDI and checked against the tune's
# Oxford Hymn Tune Index incipit. `psalter render` writes rendered/{id}/:
# notation (incipit.svg, full.svg), note timings (events.json) and audio
# (audio.mp3); entity-ingest copies them into the content build and fails if
# a tune changed since it was rendered.
#
#   meter       the tune's metre (C.M. 8.6.8.6, L.M. 8.8.8.8)
#   key         tonic and mode; the incipit check counts scale degrees from it
#   bpm         quarter notes a minute for the audio and the timings
#   pickup      beats before the first barline
#   line_beats  beats in the first line, from the start: the card's notation
#   incipit     Oxford Hymn Tune Index form of the opening (scale degrees)
#   encoding    where our MusicXML came from: CCEH tune number and file
#   review      delete once someone has sung or played the tune from the
#               MusicXML and compared it with a printed psalter
#
# Licence: the melodies are public domain; the CCEH states its files are
# "free to use in any manner". Our MusicXML: CC0.

