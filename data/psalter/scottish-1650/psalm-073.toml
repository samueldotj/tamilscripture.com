# Psalm 73 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 73

[[version]]
key = "73"
label = "C.M."
meter = "8.6.8.6"
argument = "A Psalm of Asaph."
stanzas = [
  ["¹Yet God is good to Israel,", "  to each pure-hearted one.", "²But as for me, my steps near slipp’d,", "  my feet were almost gone."],
  ["³For I envious was, and grudg’d", "  the foolish folk to see,", "When I perceiv’d the wicked sort", "  enjoy prosperity."],
  ["⁴For still their strength continueth firm;", "  their death of bands is free.", "⁵They are not toil’d like other men,", "  nor plagu’d, as others be."],
  ["⁶Therefore their pride, like to a chain,", "  them compasseth about;", "And, as a garment, violence", "  doth cover them throughout."],
  ["⁷Their eyes stand out with fat; they have", "  more than their hearts could wish.", "⁸They are corrupt; their talk of wrong", "  both lewd and lofty is."],
  ["⁹They set their mouth against the heav’ns", "  in their blasphemous talk;", "And their reproaching tongue throughout", "  the earth at large doth walk."],
  ["¹⁰His people oftentimes for this", "  look back, and turn about;", "Sith waters of so full a cup", "  to these are poured out."],
  ["¹¹And thus they say, How can it be", "  that God these things doth know?", "Or, Can there in the Highest be", "  knowledge of things below?"],
  ["¹²Behold, these are the wicked ones,", "  yet prosper at their will", "In worldly things; they do increase", "  in wealth and riches still."],
  ["¹³I verily have done in vain", "  my heart to purify;", "To no effect in innocence", "  washed my hands have I."],
  ["¹⁴For daily, and all day throughout,", "  great plagues I suffer’d have;", "Yea, ev’ry morning I of new", "  did chastisement receive."],
  ["¹⁵If in this manner foolishly", "  to speak I would intend,", "Thy children’s generation,", "  behold, I should offend."],
  ["¹⁶When I this thought to know, it was", "  too hard a thing for me;", "¹⁷Till to God’s sanctuary I went,", "  then I their end did see."],
  ["¹⁸Assuredly thou didst them set", "  a slipp’ry place upon;", "Them suddenly thou castedst down", "  into destruction."],
  ["¹⁹How in a moment suddenly", "  to ruin brought are they!", "With fearful terrors utterly", "  they are consum’d away."],
  ["²⁰Ev’n like unto a dream, when one", "  from sleeping doth arise;", "So thou, O Lord, when thou awak’st,", "  their image shalt despise."],
  ["²¹Thus grieved was my heart in me,", "  and me my reins opprest:", "²²So rude was I, and ignorant,", "  and in thy sight a beast."],
  ["²³Nevertheless continually,", "  O Lord, I am with thee:", "Thou dost me hold by my right hand,", "  and still upholdest me."],
  ["²⁴Thou, with thy counsel, while I live,", "  wilt me conduct and guide;", "And to thy glory afterward", "  receive me to abide."],
  ["²⁵Whom have I in the heavens high", "  but thee, O Lord, alone?", "And in the earth whom I desire", "  besides thee there is none."],
  ["²⁶My flesh and heart doth faint and fail,", "  but God doth fail me never:", "For of my heart God is the strength", "  and portion for ever."],
  ["²⁷For, lo, they that are far from thee", "  for ever perish shall;", "Them that a whoring from thee go", "  thou hast destroyed all."],
  ["²⁸But surely it is good for me", "  that I draw near to God:", "In God I trust, that all thy works", "  I may declare abroad."],
]
