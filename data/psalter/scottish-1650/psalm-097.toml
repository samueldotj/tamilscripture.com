# Psalm 97 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 97

[[version]]
key = "97"
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹God reigneth, let the earth be glad,", "  and isles rejoice each one.", "²Dark clouds him compass; and in right", "  with judgment dwells his throne."],
  ["³Fire goes before him, and his foes", "  it burns up round about:", "⁴His lightnings lighten did the world;", "  earth saw, and shook throughout."],
  ["⁵Hills at the presence of the Lord,", "  like wax, did melt away;", "Ev’n at the presence of the Lord", "  of all the earth, I say."],
  ["⁶The heav’ns declare his righteousness,", "  all men his glory see.", "⁷All who serve graven images,", "  confounded let them be."],
  ["Who do of idols boast themselves,", "  let shame upon them fall:", "Ye that are called gods, see that", "  ye do him worship all."],
  ["⁸Sion did hear, and joyful was,", "  glad Judah’s daughters were;", "They much rejoic’d, O Lord, because", "  thy judgments did appear."],
  ["⁹For thou, O Lord, art high above", "  all things on earth that are;", "Above all other gods thou art", "  exalted very far."],
  ["¹⁰Hate ill, all ye that love the Lord:", "  his saints’ souls keepeth he;", "And from the hands of wicked men", "  he sets them safe and free."],
  ["¹¹For all those that be righteous", "  sown is a joyful light,", "And gladness sown is for all those", "  that are in heart upright."],
  ["¹²Ye righteous, in the Lord rejoice;", "  express your thankfulness,", "When ye into your memory", "  do call his holiness."],
]
