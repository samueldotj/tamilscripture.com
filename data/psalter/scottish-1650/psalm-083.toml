# Psalm 83 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 83

[[version]]
key = "83"
label = "C.M."
meter = "8.6.8.6"
argument = "A Song or Psalm of Asaph."
stanzas = [
  ["¹Keep not, O God, we thee entreat,", "  O keep not silence now:", "Do thou not hold thy peace, O God,", "  and still no more be thou."],
  ["²For, lo, thine enemies a noise", "  tumultuously have made;", "And they that haters are of thee", "  have lifted up the head."],
  ["³Against thy chosen people they", "  do crafty counsel take;", "And they against thy hidden ones", "  do consultations make."],
  ["⁴Come, let us cut them off, said they,", "  from being a nation,", "That of the name of Isr’el may", "  no more be mention."],
  ["⁵For with joint heart they plot, in league", "  against thee they combine.", "⁶The tents of Edom, Ishm’elites,", "  Moab’s and Hagar’s line;"],
  ["⁷Gebal, and Ammon, Amalek,", "  Philistines, those of Tyre;", "⁸And Assur join’d with them, to help", "  Lot’s children they conspire."],
  ["⁹Do to them as to Midian,", "  Jabin at Kison strand;", "¹⁰And Sis’ra, which at En-dor fell,", "  as dung to fat the land."],
  ["¹¹Like Oreb and like Zeeb make", "  their noble men to fall;", "Like Zeba and Zalmunna like,", "  make thou their princes all;"],
  ["¹²Who said, For our possession", "  let us God’s houses take.", "¹³My God, them like a wheel, as chaff", "  before the wind, them make."],
  ["¹⁴As fire consumes the wood, as flame", "  doth mountains set on fire,", "¹⁵Chase and affright them with the storm", "  and tempest of thine ire."],
  ["¹⁶Their faces fill with shame, O Lord,", "  that they may seek thy name.", "¹⁷Let them confounded be, and vex’d,", "  and perish in their shame:"],
  ["¹⁸That men may know that thou, to whom", "  alone doth appertain", "The name Jehovah, dost most high", "  o’er all the earth remain."],
]
