# Psalm 8 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 8

[[version]]
key = "8"
label = "C.M."
meter = "8.6.8.6"
argument = "To the chief Musician upon Gittith, A Psalm of David."
stanzas = [
  ["¹How excellent in all the earth,", "  Lord, our Lord, is thy name!", "Who hast thy glory far advanc’d", "  above the starry frame."],
  ["²From infants’ and from sucklings’ mouth", "  thou didest strength ordain,", "For thy foes’ cause, that so thou might’st", "  th’ avenging foe restrain."],
  ["³When I look up unto the heav’ns,", "  which thine own fingers fram’d,", "Unto the moon, and to the stars,", "  which were by thee ordain’d;"],
  ["⁴Then say I, What is man, that he", "  remember’d is by thee?", "Or what the son of man, that thou", "  so kind to him should’st be?"],
  ["⁵For thou a little lower hast", "  him than the angels made;", "With glory and with dignity", "  thou crowned hast his head."],
  ["⁶Of thy hands’ works thou mad’st him lord,", "  all under’s feet didst lay;", "⁷All sheep and oxen, yea, and beasts", "  that in the field do stray;"],
  ["⁸Fowls of the air, fish of the sea,", "  all that pass through the same.", "⁹How excellent in all the earth,", "  Lord, our Lord, is thy name!"],
]
