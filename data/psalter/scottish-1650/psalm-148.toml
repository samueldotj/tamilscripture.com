stanzas = [
  ["¹The Lord of heav’n confess,", "  On high his glory raise.", "²Him let all angels bless,", "  Him all his armies praise.", "  ³Him glorify", "  Sun, moon, and stars;", "  ⁴Ye higher spheres,", "  And cloudy sky."],
  ["⁵From God your beings are,", "  Him therefore famous make;", "You all created were,", "  When he the word but spake.", "  ⁶And from that place,", "  Where fix’d you be", "  By his decree,", "  You cannot pass."],
  ["⁷Praise God from earth below,", "  Ye dragons, and ye deeps:", "⁸Fire, hail, clouds, wind, and snow.", "  Whom in command he keeps.", "  ⁹Praise ye his name,", "  Hills great and small,", "  Trees low and tall;", "  ¹⁰Beasts wild and tame;"],
  ["All things that creep or fly.", "  ¹¹Ye kings, ye vulgar throng,", "All princes mean or high;", "  ¹²Both men and virgins young,", "  Ev’n young and old,", "  ¹³Exalt his name;", "  For much his fame", "  Should be extoll’d."],
  ["O let God’s name be prais’d", "  Above both earth and sky;", "¹⁴For he his saints hath rais’d,", "  And set their horn on high;", "  Ev’n those that be", "  Of Isr’el’s race,", "  Near to his grace.", "  The Lord praise ye."],
