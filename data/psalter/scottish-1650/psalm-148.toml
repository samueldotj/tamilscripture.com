# Psalm 148 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 148

[[version]]
key = "148"
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹Praise God. From heavens praise the Lord,", "  in heights praise to him be.", "²All ye his angels, praise ye him;", "  his hosts all, praise him ye."],
  ["³O praise ye him, both sun and moon,", "  praise him, all stars of light.", "⁴Ye heav’ns of heav’ns him praise, and floods", "  above the heavens’ height."],
  ["⁵Let all the creatures praise the name", "  of our almighty Lord:", "For he commanded, and they were", "  created by his word."],
  ["⁶He also, for all times to come,", "  hath them establish’d sure;", "He hath appointed them a law,", "  which ever shall endure."],
  ["⁷Praise ye Jehovah from the earth,", "  dragons, and ev’ry deep:", "⁸Fire, hail, snow, vapour, stormy wind,", "  his word that fully keep."],
  ["⁹All hills and mountains, fruitful trees,", "  and all ye cedars high:", "¹⁰Beasts, and all cattle, creeping things,", "  and all ye birds that fly."],
  ["¹¹Kings of the earth, all nations,", "  princes, earth’s judges all:", "¹²Both young men, yea, and maidens too,", "  old men, and children small."],
  ["¹³Let them God’s name praise; for his name", "  alone is excellent:", "His glory reacheth far above", "  the earth and firmament."],
  ["¹⁴His people’s horn, the praise of all", "  his saints, exalteth he;", "Ev’n Isr’el’s seed, a people near", "  to him. The Lord praise ye."],
]

