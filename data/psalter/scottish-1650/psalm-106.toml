psalm = 106

[[version]]
key = "106"
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹Give praise and thanks unto the Lord,", "  for bountiful is he;", "His tender mercy doth endure", "  unto eternity."],
  ["²God’s mighty works who can express?", "  or shew forth all his praise?", "³Blessed are they that judgment keep,", "  and justly do always."],
  ["⁴Remember me, Lord, with that love", "  which thou to thine dost bear;", "With thy salvation, O my God,", "  to visit me draw near:"],
  ["⁵That I thy chosen’s good may see,", "  and in their joy rejoice;", "And may with thine inheritance", "  triumph with cheerful voice."],
  ["⁶We with our fathers sinned have,", "  and of iniquity", "Too long we have the workers been;", "  we have done wickedly."],
  ["⁷The wonders great, which thou, O Lord,", "  didst work in Egypt land,", "Our fathers, though they saw, yet them", "  they did not understand:"],
  ["And they thy mercies’ multitude", "  kept not in memory;", "But at the sea, ev’n the Red sea,", "  provok’d him grievously."],
  ["⁸Nevertheless he saved them,", "  ev’n for his own name’s sake;", "That so he might to be well known", "  his mighty power make."],
  ["⁹When he the Red sea did rebuke,", "  then dried up it was:", "Through depths, as through the wilderness,", "  he safely made them pass."],
  ["¹⁰From hands of those that hated them", "  he did his people save;", "And from the en’my’s cruel hand", "  to them redemption gave."],
  ["¹¹The waters overwhelm’d their foes;", "  not one was left alive.", "¹²Then they believ’d his word, and praise", "  to him in songs did give."],
  ["¹³But soon did they his mighty works", "  forget unthankfully,", "And on his counsel and his will", "  did not wait patiently;"],
  ["¹⁴But much did lust in wilderness,", "  and God in desert tempt.", "¹⁵He gave them what they sought, but to", "  their soul he leanness sent."],
  ["¹⁶And against Moses in the camp", "  their envy did appear;", "At Aaron they, the saint of God,", "  envious also were."],
  ["¹⁷Therefore the earth did open wide,", "  and Dathan did devour,", "And all Abiram’s company", "  did cover in that hour."],
  ["¹⁸Likewise among their company", "  a fire was kindled then;", "And so the hot consuming flame", "  burnt up these wicked men."],
  ["¹⁹Upon the hill of Horeb they", "  an idol-calf did frame,", "A molten image they did make,", "  and worshipped the same."],
  ["²⁰And thus their glory, and their God,", "  most vainly changed they", "Into the likeness of an ox", "  that eateth grass or hay."],
  ["²¹They did forget the mighty God,", "  that had their saviour been,", "By whom such great things brought to pass", "  they had in Egypt seen."],
  ["²²In Ham’s land he did wondrous works,", "  things terrible did he,", "When he his mighty hand and arm", "  stretch’d out at the Red sea."],
  ["²³Then said he, He would them destroy,", "  had not, his wrath to stay,", "His chosen Moses stood in breach,", "  that them he should not slay."],
  ["²⁴Yea, they despis’d the pleasant land,", "  believed not his word:", "²⁵But in their tents they murmured,", "  not heark’ning to the Lord."],
  ["²⁶Therefore in desert them to slay", "  he lifted up his hand:", "²⁷’Mong nations to o’erthrow their seed,", "  and scatter in each land."],
  ["²⁸They unto Baal-peor did", "  themselves associate;", "The sacrifices of the dead", "  they did profanely eat."],
  ["²⁹Thus, by their lewd inventions,", "  they did provoke his ire;", "And then upon them suddenly", "  the plague brake in as fire."],
  ["³⁰Then Phin’has rose, and justice did,", "  and so the plague did cease;", "³¹That to all ages counted was", "  to him for righteousness."],
  ["³²And at the waters, where they strove,", "  they did him angry make,", "In such sort, that it fared ill", "  with Moses for their sake:"],
  ["³³Because they there his spirit meek", "  provoked bitterly,", "So that he utter’d with his lips", "  words unadvisedly."],
  ["³⁴Nor, as the Lord commanded them,", "  did they the nations slay:", "³⁵But with the heathen mingled were,", "  and learn’d of them their way."],
  ["³⁶And they their idols serv’d, which did", "  a snare unto them turn.", "³⁷Their sons and daughters they to dev’ls", "  in sacrifice did burn."],
  ["³⁸In their own children’s guiltless blood", "  their hands they did imbrue,", "Whom to Canaan’s idols they", "  for sacrifices slew:"],
  ["So was the land defil’d with blood.", "  ³⁹They stain’d with their own way,", "And with their own inventions", "  a whoring they did stray."],
  ["⁴⁰Against his people kindled was", "  the wrath of God therefore,", "Insomuch that he did his own", "  inheritance abhor."],
  ["⁴¹He gave them to the heathen’s hand;", "  their foes did them command.", "⁴²Their en’mies them oppress’d, they were", "  made subject to their hand."],
  ["⁴³He many times deliver’d them;", "  but with their counsel so", "They him provok’d, that for their sin", "  they were brought very low."],
  ["⁴⁴Yet their affliction he beheld,", "  when he did hear their cry:", "⁴⁵And he for them his covenant", "  did call to memory;"],
  ["After his mercies’ multitude", "  ⁴⁶he did repent: And made", "Them to be pity’d of all those", "  who did them captive lead."],
  ["⁴⁷O Lord our God, us save, and gather", "  the heathen from among,", "That we thy holy name may praise", "  in a triumphant song."],
  ["⁴⁸Bless’d be Jehovah, Isr’el’s God,", "  to all eternity:", "Let all the people say, Amen.", "  Praise to the Lord give ye."],
]
