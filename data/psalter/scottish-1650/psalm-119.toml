  ["⁷⁸Lord, let the proud ashamed be;", "  for they, without a cause,", "With me perversely dealt: but I", "  will muse upon thy laws."],
  ["⁷⁹Let such as fear thee, and have known", "  thy statutes, turn to me.", "⁸⁰My heart let in thy laws be sound,", "  that sham’d I never be."],
