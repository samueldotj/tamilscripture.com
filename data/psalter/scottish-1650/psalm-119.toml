part = 11
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁸¹My soul for thy salvation faints;", "  yet I thy word believe.", "⁸²Mine eyes fail for thy word: I say,", "  When wilt thou comfort give?"],
