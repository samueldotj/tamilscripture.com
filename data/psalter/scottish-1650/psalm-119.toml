psalm = 119

[[version]]
key = "119-1"
part = 1
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹Blessed are they that undefil’d,", "  and straight are in the way;", "Who in the Lord’s most holy law", "  do walk, and do not stray."],
  ["²Blessed are they who to observe", "  his statutes are inclin’d;", "And who do seek the living God", "  with their whole heart and mind."],
  ["³Such in his ways do walk, and they", "  do no iniquity.", "⁴Thou hast commanded us to keep", "  thy precepts carefully."],
  ["⁵O that thy statutes to observe", "  thou would’st my ways direct!", "⁶Then shall I not be sham’d, when I", "  thy precepts all respect."],
  ["⁷Then with integrity of heart", "  thee will I praise and bless,", "When I the judgments all have learn’d", "  of thy pure righteousness."],
  ["⁸That I will keep thy statutes all", "  firmly resolv’d have I:", "O do not then, most gracious God,", "  forsake me utterly."],
]

[[version]]
key = "119-2"
part = 2
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁹By what means shall a young man learn", "  his way to purify?", "If he according to thy word", "  thereto attentive be."],
  ["¹⁰Unfeignedly thee have I sought", "  with all my soul and heart:", "O let me not from the right path", "  of thy commands depart."],
  ["¹¹Thy word I in my heart have hid,", "  that I offend not thee.", "¹²O Lord, thou ever blessed art,", "  thy statutes teach thou me."],
  ["¹³The judgments of thy mouth each one", "  my lips declared have:", "¹⁴More joy thy testimonies’ way", "  than riches all me gave."],
  ["¹⁵I will thy holy precepts make", "  my meditation;", "And carefully I’ll have respect", "  unto thy ways each one."],
  ["¹⁶Upon thy statutes my delight", "  shall constantly be set:", "And, by thy grace, I never will", "  thy holy word forget."],
]

[[version]]
key = "119-3"
part = 3
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹⁷With me thy servant, in thy grace,", "  deal bountifully, Lord:", "That by thy favor I may live,", "  and duly keep thy word."],
  ["¹⁸Open mine eyes, that of thy law", "  the wonders I may see.", "¹⁹I am a stranger on this earth,", "  hide not thy laws from me."],
  ["²⁰My soul within me breaks, and doth", "  much fainting still endure,", "Through longing that it hath all times", "  unto thy judgments pure."],
  ["²¹Thou hast rebuk’d the cursed proud,", "  who from thy precepts swerve.", "²²Reproach and shame remove from me,", "  for I thy laws observe."],
  ["²³Against me princes spake with spite,", "  while they in council sat:", "But I thy servant did upon", "  thy statutes meditate."],
  ["²⁴My comfort, and my heart’s delight,", "  thy testimonies be;", "And they, in all my doubts and fears,", "  are counsellors to me."],
]

[[version]]
key = "119-4"
part = 4
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["²⁵My soul to dust cleaves: quicken me,", "  according to thy word.", "²⁶My ways I shew’d, and me thou heard’st:", "  teach me thy statutes, Lord."],
  ["²⁷The way of thy commandements", "  make me aright to know;", "So all thy works that wondrous are", "  I shall to others show."],
  ["²⁸My soul doth melt, and drop away,", "  for heaviness and grief:", "To me, according to thy word,", "  give strength, and send relief."],
  ["²⁹From me the wicked way of lies", "  let far removed be;", "And graciously thy holy law", "  do thou grant unto me."],
  ["³⁰I chosen have the perfect way", "  of truth and verity:", "Thy judgments that most righteous are", "  before me laid have I."],
  ["³¹I to thy testimonies cleave;", "  shame do not on me cast.", "³²I’ll run thy precepts’ way, when thou", "  my heart enlarged hast."],
]

[[version]]
key = "119-5"
part = 5
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["³³Teach me, O Lord, the perfect way", "  of thy precepts divine,", "And to observe it to the end", "  I shall my heart incline."],
  ["³⁴Give understanding unto me,", "  so keep thy law shall I;", "Yea, ev’n with my whole heart I shall", "  observe it carefully."],
  ["³⁵In thy law’s path make me to go;", "  for I delight therein.", "³⁶My heart unto thy testimonies,", "  and not to greed, incline."],
  ["³⁷Turn thou away my sight and eyes", "  from viewing vanity;", "And in thy good and holy way", "  be pleas’d to quicken me."],
  ["³⁸Confirm to me thy gracious word,", "  which I did gladly hear,", "Ev’n to thy servant, Lord, who is", "  devoted to thy fear."],
  ["³⁹Turn thou away my fear’d reproach;", "  for good thy judgments be.", "⁴⁰Lo, for thy precepts I have long’d;", "  in thy truth quicken me."],
]

[[version]]
key = "119-6"
part = 6
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁴¹Let thy sweet mercies also come", "  and visit me, O Lord;", "Ev’n thy benign salvation,", "  according to thy word."],
  ["⁴²So shall I have wherewith I may", "  give him an answer just,", "Who spitefully reproacheth me;", "  for in thy word I trust."],
  ["⁴³The word of truth out of my mouth", "  take thou not utterly;", "For on thy judgments righteous", "  my hope doth still rely."],
  ["⁴⁴So shall I keep for evermore", "  thy law continually.", "⁴⁵And, sith that I thy precepts seek,", "  I’ll walk at liberty."],
  ["⁴⁶I’ll speak thy word to kings, and I", "  with shame shall not be mov’d;", "⁴⁷And will delight myself always", "  in thy laws, which I lov’d."],
  ["⁴⁸To thy commandments, which I lov’d,", "  my hands lift up I will;", "And I will also meditate", "  upon thy statutes still."],
