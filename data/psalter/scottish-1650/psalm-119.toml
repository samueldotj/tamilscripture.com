[[version]]
key = "119-8"
part = 8
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁵⁷Thou my sure portion art alone,", "  which I did chuse, O Lord:", "I have resolv’d, and said, that I", "  would keep thy holy word."],
  ["⁵⁸With my whole heart I did entreat", "  thy face and favour free:", "According to thy gracious word", "  be merciful to me."],
  ["⁵⁹I thought upon my former ways,", "  and did my life well try;", "And to thy testimonies pure", "  my feet then turned I."],
  ["⁶⁰I did not stay, nor linger long,", "  as those that slothful are;", "But hastily thy laws to keep", "  myself I did prepare."],
  ["⁶¹Bands of ill men me robb’d; yet I", "  thy precepts did not slight.", "⁶²I’ll rise at midnight thee to praise,", "  ev’n for thy judgments right."],
  ["⁶³I am companion to all those", "  who fear, and thee obey.", "⁶⁴O Lord, thy mercy fills the earth:", "  teach me thy laws, I pray."],
