[[version]]
key = "119-13"
part = 13
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁹⁷O how love I thy law! it is", "  my study all the day:", "⁹⁸It makes me wiser than my foes;", "  for it doth with me stay."],
  ["⁹⁹Than all my teachers now I have", "  more understanding far;", "Because my meditation", "  thy testimonies are."],
  ["¹⁰⁰In understanding I excel", "  those that are ancients;", "For I endeavoured to keep", "  all thy commandements."],
  ["¹⁰¹My feet from each ill way I stay’d,", "  that I may keep thy word.", "¹⁰²I from thy judgments have not swerv’d;", "  for thou hast taught me, Lord."],
  ["¹⁰³How sweet unto my taste, O Lord,", "  are all thy words of truth!", "Yea, I do find them sweeter far", "  than honey to my mouth."],
  ["¹⁰⁴I through thy precepts, that are pure,", "  do understanding get;", "I therefore ev’ry way that’s false", "  with all my heart do hate."],
