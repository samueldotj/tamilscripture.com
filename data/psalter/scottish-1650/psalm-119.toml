[[version]]
key = "119-7"
part = 7
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁴⁹Remember, Lord, thy gracious word", "  thou to thy servant spake,", "Which, for a ground of my sure hope,", "  thou causedst me to take."],
  ["⁵⁰This word of thine my comfort is", "  in mine affliction:", "For in my straits I am reviv’d", "  by this thy word alone."],
  ["⁵¹The men whose hearts with pride are stuff’d", "  did greatly me deride;", "Yet from thy straight commandements", "  I have not turn’d aside."],
