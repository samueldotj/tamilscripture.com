label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["¹⁰⁵Thy word is to my feet a lamp,", "  and to my path a light.", "¹⁰⁶I sworn have, and I will perform,", "  to keep thy judgments right."],
