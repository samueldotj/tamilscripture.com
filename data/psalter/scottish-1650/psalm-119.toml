part = 10
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁷³Thou mad’st and fashion’dst me: thy laws", "  to know give wisdom, Lord.", "⁷⁴So who thee fear shall joy to see", "  me trusting in thy word."],
  ["⁷⁵That very right thy judgments are", "  I know, and do confess;", "And that thou hast afflicted me", "  in truth and faithfulness."],
