[[version]]
key = "119-9"
part = 9
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁶⁵Well hast thou with thy servant dealt,", "  as thou didst promise give.", "⁶⁶Good judgment me, and knowledge teach,", "  for I thy word believe."],
  ["⁶⁷Ere I afflicted was I stray’d;", "  but now I keep thy word.", "⁶⁸Both good thou art, and good thou do’st:", "  teach me thy statutes, Lord."],
  ["⁶⁹The men that are puff ‘d up with pride", "  against me forg’d a lie;", "Yet thy commandements observe", "  with my whole heart will I."],
  ["⁷⁰Their hearts, through worldly ease and wealth,", "  as fat as grease they be:", "But in thy holy law I take", "  delight continually."],
  ["⁷¹It hath been very good for me", "  that I afflicted was,", "That I might well instructed be,", "  and learn thy holy laws."],
  ["⁷²The word that cometh from thy mouth", "  is better unto me", "Than many thousands and great sums", "  of gold and silver be."],
