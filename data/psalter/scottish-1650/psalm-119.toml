part = 12
label = "C.M."
meter = "8.6.8.6"
stanzas = [
  ["⁸⁹Thy word for ever is, O Lord,", "  in heaven settled fast;", "⁹⁰Unto all generations", "  thy faithfulness doth last:"],
  ["The earth thou hast established,", "  and it abides by thee.", "⁹¹This day they stand as thou ordain’dst;", "  for all thy servants be."],
  ["⁹²Unless in thy most perfect law", "  my soul delights had found,", "I should have perished, when as", "  my troubles did abound."],
  ["⁹³Thy precepts I will ne’er forget;", "  they quick’ning to me brought.", "⁹⁴Lord, I am thine; O save thou me:", "  thy precepts I have sought."],
