# Psalm 34 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 34

[[version]]
key = "34"
label = "C.M."
meter = "8.6.8.6"
argument = "A Psalm of David, when he changed his behaviour before Abimelech; who drove him away, and he departed."
stanzas = [
  ["¹God will I bless all times; his praise", "  my mouth shall still express.", "²My soul shall boast in God: the meek", "  shall hear with joyfulness."],
  ["³Extol the Lord with me, let us", "  exalt his name together.", "⁴I sought the Lord, he heard, and did", "  me from all fears deliver."],
  ["⁵They look’d to him, and lighten’d were:", "  not shamed were their faces.", "⁶This poor man cry’d, God heard, and sav’d", "  him from all his distresses."],
  ["⁷The angel of the Lord encamps,", "  and round encompasseth", "All those about that do him fear,", "  and them delivereth."],
  ["⁸O taste and see that God is good:", "  who trusts in him is bless’d.", "⁹Fear God his saints: none that him fear", "  shall be with want oppress’d."],
  ["¹⁰The lions young may hungry be,", "  and they may lack their food:", "But they that truly seek the Lord", "  shall not lack any good."],
  ["¹¹O children, hither do ye come,", "  and unto me give ear;", "I shall you teach to understand", "  how ye the Lord should fear."],
  ["¹²What man is he that life desires,", "  to see good would live long?", "¹³Thy lips refrain from speaking guile,", "  and from ill words thy tongue."],
  ["¹⁴Depart from ill, do good, seek peace,", "  pursue it earnestly.", "¹⁵God’s eyes are on the just; his ears", "  are open to their cry."],
  ["¹⁶The face of God is set against", "  those that do wickedly,", "That he may quite out from the earth", "  cut off their memory."],
  ["¹⁷The righteous cry unto the Lord,", "  he unto them gives ear;", "And they out of their troubles all", "  by him deliver’d are."],
  ["¹⁸The Lord is ever nigh to them", "  that be of broken sp’rit;", "To them he safety doth afford", "  that are in heart contrite."],
  ["¹⁹The troubles that afflict the just", "  in number many be;", "But yet at length out of them all", "  the Lord doth set him free."],
  ["²⁰He carefully his bones doth keep,", "  whatever can befall;", "That not so much as one of them", "  can broken be at all."],
  ["²¹Ill shall the wicked slay; laid waste", "  shall be who hate the just.", "²²The Lord redeems his servants’ souls;", "  none perish that him trust."],
]
