# Psalm 17 in the Psalms of David in Metre (Scottish Psalter, 1650).
# From CCEL (public domain): scripts/import-scottish-psalter.py; edit freely.
# A line starting with two spaces is indented; superscript numbers start verses.
psalm = 17

[[version]]
key = "17"
label = "C.M."
meter = "8.6.8.6"
argument = "A Prayer of David."
stanzas = [
  ["¹Lord, hear the right, attend my cry,", "  unto my pray’r give heed,", "That doth not in hypocrisy", "  from feigned lips proceed."],
  ["²And from before thy presence forth", "  my sentence do thou send:", "Toward these things that equal are", "  do thou thine eyes intend."],
  ["³Thou prov’dst mine heart, thou visit’dst me", "  by night, thou didst me try,", "Yet nothing found’st; for that my mouth", "  shall not sin, purpos’d I."],
  ["⁴As for men’s works, I, by the word", "  that from thy lips doth flow,", "Did me preserve out of the paths", "  wherein destroyers go."],
  ["⁵Hold up my goings, Lord, me guide", "  in those thy paths divine,", "So that my footsteps may not slide", "  out of those ways of thine."],
  ["⁶I called have on thee, O God,", "  because thou wilt me hear:", "That thou may’st hearken to my speech,", "  to me incline thine ear."],
  ["⁷Thy wondrous loving-kindness show,", "  thou that, by thy right hand,", "Sav’st them that trust in thee from those", "  that up against them stand."],
  ["⁸As th’ apple of the eye me keep;", "  in thy wings shade me close", "⁹From lewd oppressors, compassing", "  me round, as deadly foes."],
  ["¹⁰In their own fat they are inclos’d;", "  their mouth speaks loftily.", "¹¹Our steps they compass’d; and to ground", "  down bowing set their eye."],
  ["¹²He like unto a lion is", "  that’s greedy of his prey,", "Or lion young, which lurking doth", "  in secret places stay."],
  ["¹³Arise, and disappoint my foe,", "  and cast him down, O Lord:", "My soul save from the wicked man,", "  the man which is thy sword."],
  ["¹⁴From men, which are thy hand, O Lord,", "  from worldly men me save,", "Which only in this present life", "  their part and portion have."],
  ["Whose belly with thy treasure hid", "  thou fill’st: they children have", "In plenty; of their goods the rest", "  they to their children leave."],
  ["¹⁵But as for me, I thine own face", "  in righteousness will see;", "And with thy likeness, when I wake,", "  I satisfy’d shall be."],
]
