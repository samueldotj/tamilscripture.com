[[version]]
key = "136"
label = "8.7.8.7"
meter = "8.7.8.7"
stanzas = [
  ["¹Give thanks to God, for good is he:", "  for mercy hath he ever.", "²Thanks to the God of gods give ye:", "  for his grace faileth never."],
  ["³Thanks give the Lord of lords unto:", "  for mercy hath he ever.", "⁴Who only wonders great can do:", "  for his grace faileth never."],
  ["⁵Who by his wisdom made heav’ns high:", "  for mercy hath he ever.", "⁶Who stretch’d the earth above the sea:", "  for his grace faileth never."],
  ["⁷To him that made the great lights shine:", "  for mercy hath he ever.", "⁸The sun to rule till day decline:", "  for his grace faileth never."],
  ["⁹The moon and stars to rule by night:", "  for mercy hath he ever.", "¹⁰Who Egypt’s first-born kill’d outright:", "  for his grace faileth never."],
  ["¹¹And Isr’el brought from Egypt land:", "  for mercy hath he ever.", "¹²With stretch’d-out arm, and with strong hand:", "  for his grace faileth never."],
  ["¹³By whom the Red sea parted was:", "  for mercy hath he ever.", "¹⁴And through its midst made Isr’el pass:", "  for his grace faileth never."],
  ["¹⁵But Phar’oh and his host did drown:", "  for mercy hath he ever.", "¹⁶Who through the desert led his own:", "  for his grace faileth never."],
  ["¹⁷To him great kings who overthrew:", "  for he hath mercy ever.", "¹⁸Yea, famous kings in battle slew:", "  for his grace faileth never."],
  ["¹⁹Ev’n Sihon king of Amorites:", "  for he hath mercy ever.", "²⁰And Og the king of Bashanites:", "  for his grace faileth never."],
  ["²¹Their land in heritage to have:", "  (for mercy hath he ever.)", "²²His servant Isr’el right he gave:", "  for his grace faileth never."],
  ["²³In our low state who on us thought:", "  for he hath mercy ever.", "²⁴And from our foes our freedom wrought:", "  for his grace faileth never."],
  ["²⁵Who doth all flesh with food relieve:", "  for he hath mercy ever.", "²⁶Thanks to the God of heaven give:", "  for his grace faileth never."],
]

