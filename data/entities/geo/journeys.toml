# Journeys for the atlas: ordered stops that reference place ids from the
# OpenBible geocoding data (see content/…/entities/places.json). `routes` names
# files in ubs-routes-sa/GeoJsonRoutes (UBS Project MARBLE, CC BY-SA 4.0) whose
# lines are drawn instead of straight legs; a journey without `routes` gets
# straight legs. Stops, names, summaries and passages here are ours, CC BY 4.0;
# maps that include UBS lines are CC BY-SA 4.0. Tamil names drafted by the
# maintainers; corrections welcome.

