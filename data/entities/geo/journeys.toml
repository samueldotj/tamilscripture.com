[[journey]]
id = "exodus"
name_en = "The Exodus from Egypt"
name_ta = "எகிப்திலிருந்து புறப்பாடு"
period = "exodus"
summary_en = "From Rameses to the plains of Moab: the route of Israel out of Egypt, to Sinai, and through the wilderness to the Jordan."
summary_ta = "ராமசேசிலிருந்து மோவாபின் சமவெளிகள் வரை: இஸ்ரவேலர் எகிப்திலிருந்து புறப்பட்டு, சீனாய்க்கு வந்து, வனாந்திரம் வழியாக யோர்தானுக்குச் சென்ற வழி."
passages = ["EXO.12.37-EXO.19.2", "NUM.20.1-NUM.22.1", "NUM.33.1-NUM.33.49"]
