# Theological glossary for the Tamil dictionary drafts (docs/feature_dictionary_translation.md §3).
# English term → the Tamil the translator must use. `forms` are inflections that
# count as using it; `avoid` lists renderings a draft must not use; `source` is
# "irv" (the IRV's own word, see `verses` and `strongs`) or "curated" (no single
# Bible word; the owner's choice). Proposed by `translate ai-terms`, approved on
# `translate review-terms --web`; entries with `review = true` are not used yet.
# Licence: CC BY 4.0 (tamilscripture.com contributors).


["adoption"]
ta = "புத்திரசுவிகாரம்"
forms = ["புத்திரசுவிகாரம்", "புத்திரசுவிகாரமும்", "புத்திரசுவிகாரத்தை"]
also = ["adopted"]
avoid = ["தத்தெடுத்தல்", "சுவீகாரம் (non-theological/legal usage)"]
source = "irv"
strongs = ["G5206"]
verses = ["ROM.8.23", "ROM.9.4", "GAL.4.5", "EPH.1.5"]
group = "salvation"
note = "[Claude: high] IRV has புத்திரசுவிகாரம் in Rom 9:4 and Gal 4:5; Rom 8:23 paraphrases as 'பிள்ளை என்கிற உரிமை' and Eph 1:5 as 'அவருக்குச் சொந்த பிள்ளைகளாகும்படி'. Use தத்தெடுத்தல் only where a dictionary article speaks of ordinary legal adoption (e.g. Moses, Esther)."

["adultery"]
ta = "விபசாரம்"
forms = ["விபசாரம்", "விபசாரத்திலே", "விபசாரத்தில்", "விபசாரனும்", "விபசாரியும்", "விபசாரிகளையும்"]
also = ["adulterer"]
avoid = ["வேசித்தனம்", "விபச்சாரம் (spelling with double ச் used only for harlotry contexts)", "தாசித்தனம்"]
source = "irv"
strongs = ["H5003", "G3431"]
verses = ["LEV.20.10", "JER.3.9", "EZK.16.38", "HOS.4.13", "MAT.19.18", "JHN.8.4"]
group = "sin"
note = "[Claude: high] IRV distinguishes விபசாரம் (adultery) from வேசித்தனம்/விபச்சாரம் (whoredom, harlotry) in the same verses (Jer 3:9; Hos 4:13); the adulterer is விபசாரன், the adulteress விபசாரி. [Not in the IRV verses, dropped: விபசாரங்களும், விபசாரக்காரர்களும்]"

["allegory"]
ta = "ஞான அர்த்தம்"
forms = ["ஞான அர்த்தம்"]
also = ["allegorical"]
avoid = ["உருவகக் கதை", "உவமை"]
source = "irv"
verses = ["GAL.4.24"]
group = "scripture"
note = "[Claude: medium] Gal 4:24 IRV: 'இவைகள் ஞான அர்த்தம் உள்ளவைகள்'. For the adjective 'allegorical' use ஞான அர்த்தமுள்ள; avoid உவமை, which the IRV reserves for parable."

["Almighty"]
ta = "சர்வவல்லமையுள்ள தேவன்"
forms = ["சர்வவல்லமையுள்ள தேவன்", "சர்வவல்லமையுள்ள தேவனை", "சர்வவல்லமையுள்ள தேவனிடத்தில்", "சர்வவல்லவரின்", "சர்வவல்லவரால்"]
avoid = ["எல்லாம் வல்லவர் (RC/TCV style)", "சர்வசக்தன்"]
source = "irv"
strongs = ["H7706"]
verses = ["GEN.17.1", "NUM.24.4", "JOB.8.5", "JOB.22.23", "JOB.27.13", "JOB.35.13"]
group = "god"
note = "[Claude: high] IRV uses சர்வவல்லமையுள்ள தேவன் and, standing alone, சர்வவல்லவர் (JOB.27.13, NUM.24.4). Use சர்வவல்லவர் where 'the Almighty' stands without 'God'."

["altar"]
ta = "பலிபீடம்"
forms = ["பலிபீடம்", "பலிபீடத்தின்மேல்", "பலிபீடமாக", "பலிபீடங்களை", "பலிபீடங்களையும்", "தகனபலிபீடத்தையும்"]
also = ["altars"]
avoid = ["யாகபீடம்", "வேதிகை", "ஹோமகுண்டம்", "பீடம் (alone)"]
source = "irv"
strongs = ["H4196"]
verses = ["GEN.8.20", "EXO.40.10", "LEV.9.12", "JOS.22.10", "1KI.19.14", "2CH.33.15"]
group = "worship"
note = "[Claude: high] பலிபீடம் everywhere (Gen 8:20; Jos 22:10; 1Ki 19:14; 2Ch 33:15). 'Altar of burnt offering' becomes தகனபலிபீடம் (Exo 40:10); the incense altar is தூபபீடம் elsewhere in IRV. [Not in the IRV verses, dropped: பலிபீடத்தை, பலிபீடத்திற்கு]"

["angel"]
ta = "தூதன்"
forms = ["தூதன்", "தூதனானவர்", "தூதனை", "தேவதூதனானவர்"]
also = ["angels"]
avoid = ["வானவர்", "தேவதை", "அமரர்"]
source = "irv"
strongs = ["H4397"]
verses = ["GEN.16.7", "EXO.14.19", "JDG.2.1", "JDG.13.20", "1CH.21.16", "ZEC.1.11"]
group = "last_things"
note = "[Claude: high] IRV: யெகோவாவுடைய தூதன் for 'angel of the LORD' and தேவதூதன் for 'angel of God'; plural தூதர்கள். Use தூதன் as the base and prefix தேவ-/யெகோவாவுடைய where the English has it."

["anger"]
ta = "கோபம்"
forms = ["கோபம்", "கோபத்தை", "கோபத்திலே", "கோபமுண்டாக்கி"]
avoid = ["சினம்", "கடுங்கோபம்", "எரிச்சல்"]
source = "irv"
strongs = ["H2534", "H3707", "H6440", "H2740", "G3709"]
verses = ["EXO.32.11", "1KI.16.7", "EZR.10.14", "ISA.63.6", "JER.32.37", "EZK.20.8"]
group = "god"
note = "[Claude: high] கோபம் is the consistent IRV word; 'fierce anger/wrath' becomes கடுங்கோபம் (Ezr 10:14, Isa 63:6) and சினம் appears once alongside it (Jer 32:37). 'Provoke to anger' = கோபமுண்டாக்க/கோபமூட்ட. [Not in the IRV verses, dropped: கோபத்தினாலே, கோபமூட்டுகிறார்கள்]"

["anointing"]
ta = "அபிஷேகம்"
forms = ["அபிஷேகம்", "அபிஷேகம் செய்து", "அபிஷேகம்செய்து", "அபிஷேகம் பெற்ற", "அபிஷேகம் செய்தாரே", "அபிஷேகம்செய்தார்கள்"]
also = ["anoint", "anointed"]
avoid = ["திருப்பொழிவு", "எண்ணெய் பூசுதல்"]
source = "irv"
strongs = ["H4886", "H4899", "H4888"]
verses = ["GEN.31.13", "EXO.40.11", "NUM.3.3", "1SA.15.17", "2SA.5.17", "1CH.16.22"]
group = "spirit"
note = "[Claude: high] IRV uniformly uses அபிஷேகம் (verb அபிஷேகம் செய்); the anointed one is அபிஷேகம் செய்யப்பட்டவர். திருப்பொழிவு is the TCV/Catholic rendering; plain எண்ணெய் பூசுதல் is only for ordinary oiling. [Not in the IRV verses, dropped: அபிஷேகம்செய்தவர்கள்]"

["antichrist"]
ta = "அந்திக்கிறிஸ்து"
forms = ["அந்திக்கிறிஸ்து", "அந்திக்கிறிஸ்துகள்", "அந்திக்கிறிஸ்துவினுடைய", "அந்திக்கிறிஸ்துவுமாக"]
avoid = ["எதிர்க்கிறிஸ்து", "கிறிஸ்து விரோதி"]
source = "irv"
verses = ["1JN.2.18", "1JN.2.22", "1JN.4.3", "2JN.1.7"]
group = "last_things"
note = "[Claude: high] அந்திக்கிறிஸ்து is the established transliteration in all four Johannine verses."

["Apocrypha"]
ta = "அபோக்ரிபா"
forms = ["அபோக்ரிபா", "அபோக்ரிபா நூல்கள்"]
also = ["apocryphal"]
avoid = ["இணைத் திருமுறை நூல்கள்", "மறைநூல் இணைப்பு"]
source = "curated"
group = "scripture"
note = "[Claude: medium] Tamil Protestant usage transliterates as அபோக்ரிபா (sometimes expanded அபோக்ரிபா நூல்கள் / மறைபொருள் நூல்கள்); 'apocryphal' = அபோக்ரிபாவைச் சேர்ந்த or, of a story, போலியான. Avoid the Roman Catholic இணைத் திருமுறை (deuterocanonical), which implies canonicity."

["apostle"]
ta = "அப்போஸ்தலன்"
forms = ["அப்போஸ்தலன்", "அப்போஸ்தலர்கள்", "அப்போஸ்தலர்களுடைய", "அப்போஸ்தலர்களாலே", "அப்போஸ்தலர்களிலும்", "அப்போஸ்தலர்களாக"]
also = ["apostles", "apostleship"]
avoid = ["தூதன்", "அனுப்பப்பட்டவன்", "சீடன்"]
source = "irv"
verses = ["MAT.10.2", "ACT.2.43", "ACT.8.14", "ROM.1.5", "2CO.11.5", "1TH.2.6"]
group = "church"
note = "[Claude: high] For 'apostleship' (ROM.1.5, where the IRV redistributes the clause) use அப்போஸ்தலத்துவம். Do not use தூதன், which the IRV reserves for angels/messengers. [Not in the IRV verses, dropped: அப்போஸ்தலர்களிடத்திற்கும்]"

["Aramaic"]
ta = "அராமிக் மொழி"
forms = ["அராமிக் மொழி"]
avoid = ["சீரிய மொழி", "எபிரெய மொழி"]
source = "curated"
group = "scripture"
note = "[Claude: medium] No verse; the IRV elsewhere uses அரமேயம்/சீரிய மொழி for Aramaic (cf. 2Ki 18:26). Modern Tamil Christian writing uses அராமிக் மொழி; note that the NT's 'Hebrew tongue' often means Aramaic."

["archangel"]
ta = "பிரதான தூதன்"
forms = ["பிரதான தூதன்", "பிரதான தூதனுடைய", "பிரதான தூதனாகிய"]
avoid = ["தலைமை வானவர்", "மகா தூதன்"]
source = "irv"
verses = ["1TH.4.16", "JUD.1.9"]
group = "last_things"
note = "[Claude: high] Same wording in both 1 Thess 4:16 and Jude 9."

["ark of the covenant"]
ta = "உடன்படிக்கைப் பெட்டி"
forms = ["உடன்படிக்கைப் பெட்டி", "உடன்படிக்கைப் பெட்டியை", "உடன்படிக்கைப் பெட்டியையும்", "உடன்படிக்கைப்பெட்டியை", "உடன்படிக்கைப் பெட்டியின்"]
avoid = ["பேழை", "உடன்படிக்கைப் பேழை", "சாட்சிப்பெட்டி"]
source = "irv"
verses = ["NUM.10.33", "JOS.3.3", "JOS.4.9", "1SA.4.4", "1CH.15.25", "1CH.22.19"]
group = "worship"
note = "[Claude: high] IRV uses சாட்சிப்பெட்டி for 'ark of the testimony' and பேழை for Noah's ark; keep உடன்படிக்கைப் பெட்டி for the ark of the covenant."

["Arminian"]
ta = "ஆர்மீனியனியம்"
forms = ["ஆர்மீனியனியம்", "ஆர்மீனியனியர்", "ஆர்மீனியன் கொள்கை"]
also = ["Arminianism"]
avoid = ["ஆர்மீனியா (the country Armenia)"]
source = "curated"
group = "church"
note = "[Claude: low] No settled Tamil term; many writers simply say ஆர்மீனியன் கொள்கை (Arminian doctrine) with ஆர்மீனியனியர் for the adherents. Must be kept distinct from ஆர்மீனியா/ஆர்மீனியன் meaning Armenian."

["ascension"]
ta = "ஏறுதல்"
forms = ["ஏறுதல்", "ஏறி", "ஏறினார்", "ஏறினேன்", "ஏறினவன்"]
also = ["ascended"]
avoid = ["விண்ணேற்றம்", "ஆரோகணம்"]
source = "irv"
strongs = ["H5927", "G3588"]
verses = ["EXO.2.23", "2KI.19.23", "ISA.37.24", "JHN.3.13", "ACT.10.4", "EPH.4.9"]
group = "christ"
note = "[Claude: medium] IRV uses the verb ஏறு (ஏறினார், ஏறினவன்) for ascending; in Exo 2:23 the cry 'came up' is எட்டினது. For Christ's ascension Tamil Protestant usage is பரமஏறுதல் / பரமேறுதல்; the Catholic/TCV விண்ணேற்றம் should be avoided. [Not in the IRV verses, dropped: ஏறினவரும்]"

["assurance"]
ta = "நிச்சயம்"
forms = ["நிச்சயம்", "நிச்சயமுமாக"]
avoid = ["ஆதாரம்", "உத்தரவாதம்"]
source = "irv"
strongs = ["G5287"]
verses = ["HEB.3.14", "HEB.11.1"]
group = "salvation"
note = "[Claude: medium] Heb 11:1 renders hypostasis-related terms with உறுதி and நிச்சயம்; Heb 3:14 'confidence' is நம்பிக்கை. For the doctrine of assurance of salvation, இரட்சிப்பின் நிச்சயம் is the established Tamil phrase; Acts 17:31 'assurance' (proof) would be ஆதாரம், a different sense."

["atonement"]
ta = "பாவநிவிர்த்தி"
forms = ["பாவநிவிர்த்தி", "பாவநிவிர்த்தியில்லை"]
also = ["atone"]
avoid = ["பரிகாரம்", "பலி"]
source = "irv"
strongs = ["H3722"]
verses = ["EXO.29.33", "LEV.5.6", "LEV.14.18", "LEV.16.16", "NUM.5.8", "NUM.35.33"]
group = "salvation"
note = "[Claude: high] IRV renders kaphar as பாவநிவிர்த்தி செய் in most places (Exo 29:33; Lev 5:6; 14:18; Num 5:8; 35:33); at Lev 16:16 it uses பிராயச்சித்தம். Prefer பாவநிவிர்த்தி for the doctrinal sense and mention பிராயச்சித்தம் only where quoting Lev 16."

["baptism"]
ta = "ஞானஸ்நானம்"
forms = ["ஞானஸ்நானம்", "ஞானஸ்நானம் பெற்றார்கள்", "ஞானஸ்நானம் கொடுக்கிறேன்", "ஞானஸ்நானம் பெறும்படி"]
also = ["baptize", "baptized", "baptise", "baptised"]
avoid = ["திருமுழுக்கு", "ஸ்நானம் (bathing)", "தீட்சை"]
source = "irv"
verses = ["MAT.3.6", "MRK.1.8", "LUK.7.30", "ACT.2.38", "ACT.13.24", "1CO.1.14"]
group = "church"
note = "[Claude: high] IRV uniformly ஞானஸ்நானம்; baptize = ஞானஸ்நானம் கொடு/பெறு. திருமுழுக்கு is the TCV/Catholic rendering and should not be used here. [Not in the IRV verses, dropped: ஞானஸ்நானத்தை]"

["baptism of the Spirit"]
ta = "பரிசுத்த ஆவியானவரால் ஞானஸ்நானம்"
forms = ["பரிசுத்த ஆவியானவரால் ஞானஸ்நானம்", "ஆவியின் ஞானஸ்நானம்", "பரிசுத்த ஆவியினாலே ஞானஸ்நானம்"]
avoid = ["திருமுழுக்கு", "ஆவி திருமுழுக்கு"]
source = "curated"
group = "spirit"
note = "[Claude: medium] No verse supplied, but IRV consistently renders baptizo as ஞானஸ்நானம் (e.g. Acts 1:5, Matt 3:11), so the Spirit-baptism phrase is built on it. திருமுழுக்கு is the TCV/Catholic word and should not be used on this site."

["bishop"]
ta = "கண்காணி"
forms = ["கண்காணி", "கண்காணியானவன்", "கண்காணியுமாக"]
also = ["bishops", "overseer"]
avoid = ["ஆயர்", "மேற்றிராணியார்", "மேய்ப்பர்"]
source = "irv"
strongs = ["G1985"]
verses = ["1TI.3.2", "TIT.1.7", "1PE.2.25"]
group = "church"
note = "[Claude: high] IRV renders episkopos as கண்காணி for both 'bishop' and 'overseer'. ஆயர்/மேற்றிராணியார் are Catholic/episcopal titles; மேய்ப்பர் belongs to 'shepherd/pastor' (note 1Pe 2:25 pairs மேய்ப்பர் and கண்காணி). [Not in the IRV verses, dropped: கண்காணிகளுக்கும்]"

["blasphemy"]
ta = "நிந்தை"
forms = ["நிந்தை", "நிந்தித்தான்", "நிந்தித்ததை", "நிந்திக்கும்படி", "நிந்தனையும்"]
also = ["blaspheme"]
