note = "[Claude: high] IRV renders the fierce/poured-out wrath of God as கடுங்கோபம்; it also uses மூர்க்கம் (Gen 49:7, human cruelty), உக்கிரம் (Jer 32:37) and 'உக்கிரமான கோபம்' (Rom 2:8). Reserve plain கோபம் for 'anger'. [Not in the IRV verses, dropped: கடுங்கோபத்தைவிட்டு]"
