color = "#008300"

[[theme]]
id = "repent"
order = 8
en = "Repentance"
ta = "மனந்திரும்புதல்"
color = "#E87BA4"

# Genres: the 15 types of Sean Finnegan's "All 150 Psalms Categorized"
# (restitutio.org, 2024). A psalm may have several. `mood` is Brueggemann's
# orientation / disorientation / reorientation, as the source groups them;
# Zion psalms are of mixed mood. Descriptions are our own wording.
[[genre]]
id = "praise"
order = 1
mood = "orientation"
en = "Praise"
ta = "துதிப் பாடல்கள்"
about_en = "Praise of God for who he is and what he has done."
about_ta = "தேவனுடைய தன்மைக்காகவும் கிரியைகளுக்காகவும் அவரைத் துதிக்கும் பாடல்கள்."
review = true

[[genre]]
id = "historical"
order = 2
mood = "orientation"
en = "Historical"
ta = "வரலாற்றுப் பாடல்கள்"
about_en = "Retellings of God's dealings with his people."
about_ta = "தேவன் தம் ஜனங்களோடு நடந்துகொண்ட வரலாற்றை நினைவுகூரும் பாடல்கள்."
review = true

[[genre]]
id = "torah"
order = 3
mood = "orientation"
en = "Torah"
ta = "வேதப் பிரமாணப் பாடல்கள்"
about_en = "Delight in God's law and the blessing of keeping it."
about_ta = "கர்த்தருடைய வேதத்தில் பிரியமும், அதைக் கைக்கொள்வதன் ஆசீர்வாதமும்."
review = true

[[genre]]
id = "creation"
order = 4
mood = "orientation"
en = "Creation"
ta = "சிருஷ்டிப் பாடல்கள்"
about_en = "Wonder at the order and beauty of the created world."
about_ta = "சிருஷ்டியின் ஒழுங்கையும் அழகையும் கண்டு வியக்கும் பாடல்கள்."
review = true

[[genre]]
id = "royal"
order = 5
mood = "orientation"
en = "Royal"
ta = "அரச சங்கீதங்கள்"
about_en = "Psalms about the king; the messianic psalms."
about_ta = "ராஜாவைப் பற்றிய சங்கீதங்கள்; மேசியாவைக் குறித்த சங்கீதங்கள்."
review = true

[[genre]]
id = "enthronement"
order = 6
mood = "orientation"
en = "Enthronement"
ta = "அரசாட்சிப் பாடல்கள்"
about_en = "The LORD reigns: God seated on his throne, ruling the earth."
about_ta = "கர்த்தர் ராஜரிகம்பண்ணுகிறார்: சிங்காசனத்தில் வீற்றிருந்து ஆளுகிறவர்."
review = true

[[genre]]
id = "wisdom"
