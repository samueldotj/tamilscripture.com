# Vocabulary of the Psalms explorer: themes, genres, collections and authors.
# Design: docs/feature_psalms_explorer.md. psalms.toml refers to these ids.
#
# Ids are permanent: they appear in URLs (/psalms?genre=trust) and in saved
# filters, so rename the labels, never the id. `order` sets the order in the
# filter panels. `review = true` marks a Tamil label that is a draft; delete
# it once checked. Tamil follows the IRV's vocabulary where the IRV has a word.
# Licence: CC BY 4.0 (tamilscripture.com contributors).

# Themes: every psalm has exactly one. It colours the bar under the psalm's
# number in the grid, so the colours are from the design (Psalms Explorer v2)
# and must stay distinct from one another in both light and dark themes.
[[theme]]
id = "praise"
order = 1
en = "Praise"
ta = "துதி"
color = "#EDA100"

[[theme]]
id = "lament"
order = 2
en = "Lament"
ta = "புலம்பல்"
color = "#4A3AA7"

[[theme]]
id = "thanks"
order = 3
en = "Thanksgiving"
ta = "நன்றி"
color = "#EB6834"

[[theme]]
id = "trust"
order = 4
en = "Trust"
ta = "நம்பிக்கை"
color = "#2A78D6"

[[theme]]
id = "wisdom"
order = 5
en = "Wisdom & Torah"
ta = "ஞானம்"
color = "#1BAF7A"

[[theme]]
id = "royal"
order = 6
en = "Royal & Messianic"
ta = "அரச சங்கீதங்கள்"
color = "#E34948"

[[theme]]
id = "zion"
order = 7
en = "Zion & Pilgrimage"
