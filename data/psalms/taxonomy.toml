about_ta = "விடுதலைக்கான விண்ணப்பங்கள், பெரும்பாலும் சத்துருக்களிடமிருந்து."
review = true

[[genre]]
id = "complaint"
order = 11
mood = "disorientation"
en = "Complaint"
ta = "முறையீட்டுப் பாடல்கள்"
about_en = "\"How long?\" and \"Why?\" brought honestly before God."
about_ta = "\"எதுவரைக்கும்?\" \"ஏன்?\" என்று தேவனிடம் முறையிடும் பாடல்கள்."
review = true

[[genre]]
id = "repentance"
order = 12
